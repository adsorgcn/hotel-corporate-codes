<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Hotel Corporate Codes — 290 corporate rate codes across 10 hotel groups, open data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#12466E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#F0B657" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#F0B657" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF9F4"/>
      <stop offset="1" stop-color="#EDE8DD"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B657"/>
      <stop offset="1" stop-color="#D99A2B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FFFFFF">
    <text x="96" y="208" font-size="15" letter-spacing="3.6" fill="#F0B657" font-weight="600">OPEN DATA · MIT · JSON + NPM</text>
    <text x="94" y="286" font-size="64" font-weight="700" letter-spacing="-1.4">Hotel Corporate</text>
    <text x="94" y="356" font-size="64" font-weight="700" letter-spacing="-1.4">Codes</text>
    <text x="96" y="412" font-size="23" fill="#FFFFFF" fill-opacity="0.78">290 corporate rate codes across 10 hotel groups,</text>
    <text x="96" y="446" font-size="23" fill="#FFFFFF" fill-opacity="0.78">source-linked and machine-readable.</text>
    <text x="96" y="520" font-size="17" letter-spacing="1.2" fill="#FFFFFF" fill-opacity="0.6">github.com/adsorgcn/hotel-corporate-codes</text>
  </g>

  <g transform="translate(930 330) rotate(-8)">
    <rect x="-180" y="-112" width="380" height="238" rx="22" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" transform="translate(34 40)"/>
    <rect x="-180" y="-112" width="380" height="238" rx="22" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14" transform="translate(17 20)"/>
    <g filter="url(#shadow)">
      <rect x="-190" y="-119" width="380" height="238" rx="22" fill="url(#card)"/>
      <rect x="-190" y="-62" width="380" height="30" fill="#1B2733"/>
      <rect x="-156" y="2" width="52" height="40" rx="7" fill="url(#gold)"/>
      <path d="M-147 12h34M-147 22h34M-147 32h34M-130 2v40" stroke="#8E6A1C" stroke-opacity="0.55" stroke-width="1.3"/>
      <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
        <text x="-156" y="-84" font-size="14" font-weight="700" letter-spacing="2.8" fill="#12466E">HOTELCORPORATECODES</text>
        <text x="158" y="-84" font-size="13" letter-spacing="1.8" fill="#1B2733" fill-opacity="0.55" text-anchor="end">REF · 2026</text>
        <text x="-84" y="36" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="48" font-weight="700" letter-spacing="5" fill="#12466E">SIE</text>
        <text x="-156" y="82" font-size="14" letter-spacing="1.6" fill="#1B2733" fill-opacity="0.7">SIEMENS · MARRIOTT BONVOY</text>
        <text x="158" y="82" font-size="14" letter-spacing="1.6" fill="#1B2733" fill-opacity="0.7" text-anchor="end">GLOBAL</text>
      </g>
    </g>
  </g>

  <rect x="96" y="560" width="64" height="4" rx="2" fill="#F0B657"/>
</svg>
